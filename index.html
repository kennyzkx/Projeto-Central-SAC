<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ALCANS | Central de Atendimento</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-container">

        <!-- ÁREA ALCANS -->

        <section class="brand-section">

            <canvas id="networkCanvas"></canvas>

            <div class="brand-overlay"></div>

            <div class="brand-content">

                <div class="brand-logo">
                    ALCANS
                </div>

                <div class="brand-line"></div>

                <h1>
                    Central de Atendimento
                </h1>

                <p>
                    Tudo o que você precisa para realizar um atendimento
                    com mais rapidez, qualidade e excelência.
                </p>

                <div class="connection-status">

                    <span class="status-dot"></span>

                    <span>
                        Sistema interno ALCANS
                    </span>

                </div>

            </div>

            <div class="brand-footer">
                ALCANS • Central SAC
            </div>

        </section>


        <!-- LOGIN -->

        <section class="login-section">

            <div class="login-box">

                <div class="login-header">

                    <span class="login-label">
                        CENTRAL SAC
                    </span>

                    <h2>
                        Bem-vindo de volta
                    </h2>

                    <p>
                        Acesse sua conta para continuar.
                    </p>

                </div>


                <form id="loginForm">

                    <div class="input-group">

                        <label for="username">
                            Usuário
                        </label>

                        <input
                            type="text"
                            id="username"
                            placeholder="Digite seu usuário"
                            autocomplete="username"
                        >

                    </div>


                    <div class="input-group">

                        <label for="password">
                            Senha
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                placeholder="Digite sua senha"
                                autocomplete="current-password"
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="togglePassword"
                                aria-label="Mostrar senha"
                            >

                                <svg
                                    id="eyeOpen"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >

                                    <path
                                        d="M2 12s3.5-7 10-7
                                        10 7 10 7-3.5 7-10 7
                                        S2 12 2 12Z"
                                    />

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="3"
                                    />

                                </svg>


                                <svg
                                    id="eyeClosed"
                                    class="hidden"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >

                                    <path d="M3 3l18 18"/>

                                    <path
                                        d="M10.6 10.6
                                        a2 2 0 0 0 2.8 2.8"
                                    />

                                    <path
                                        d="M9.9 4.2
                                        A10.8 10.8 0 0 1 12 4
                                        c6.5 0 10 8 10 8
                                        a18.6 18.6 0 0 1-3 4.2"
                                    />

                                    <path
                                        d="M6.6 6.6
                                        C3.6 8.5 2 12 2 12
                                        s3.5 8 10 8
                                        a10.8 10.8 0 0 0 3.1-.5"
                                    />

                                </svg>

                            </button>

                        </div>

                    </div>


                    <div
                        class="login-message"
                        id="loginMessage"
                    ></div>


                    <button
                        type="submit"
                        class="login-button"
                        id="loginButton"
                    >

                        <span id="buttonText">
                            Entrar
                        </span>

                        <span
                            class="button-loader hidden"
                            id="buttonLoader"
                        ></span>

                        <span class="button-arrow">
                            →
                        </span>

                    </button>

                </form>


                <div class="login-footer">
                    Acesso restrito aos colaboradores.
                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
